# nginx, unprivileged so it satisfies PodSecurity "restricted".
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-content
  namespace: nginx-ambient
data:
  index.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><title>Istio ambient demo</title></head>
      <body style="font-family:system-ui,sans-serif;margin:4rem auto;max-width:34rem">
        <h1>nginx behind Istio ambient</h1>
        <p>L4 mTLS by ztunnel. L7 by a waypoint. Ingress via Envoy on an NSX ALB VIP.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-ambient
  labels: {app: nginx}
spec:
  replicas: 2
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - {name: http, containerPort: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits:   {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /, port: http}
        volumeMounts:
        - {name: content, mountPath: /usr/share/nginx/html}
        - {name: cache,   mountPath: /var/cache/nginx}
        - {name: run,     mountPath: /tmp}
      volumes:
      - name: content
        configMap: {name: nginx-content}
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-ambient
  labels: {app: nginx}
spec:
  type: ClusterIP
  selector: {app: nginx}
  ports:
  - {name: http, port: 80, targetPort: http, appProtocol: http}
