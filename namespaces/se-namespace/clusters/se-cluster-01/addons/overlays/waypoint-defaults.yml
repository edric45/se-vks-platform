# Extra manifest injected into the Istio package's rendered output.
#
# NOT a ytt overlay patch -- there is deliberately no #@ syntax in this file.
# kapp-controller's ytt-paths-from-secret-name annotation adds the file to
# ytt's INPUT SET, and ytt emits every non-annotated YAML document it is given.
# So a plain manifest is simply appended to the package output. Patching an
# existing object would instead need #@ load("@ytt:overlay", "overlay") and
# #@overlay/match -- see README.md in this directory.
#
# WHY AN OVERLAY, AND WHY THIS SHAPE
#
# HPA and PodDisruptionBudget for waypoints cannot be set through the addon --
# there is no value for them. Nor can an overlay patch the waypoint Deployment
# directly: istiod generates it at runtime when a Gateway is created, so it
# carries no kapp app label and is never part of the package for ytt to match.
#
# What an overlay CAN do is add a new object to the package render. Istio reads
# a ConfigMap in the root namespace labelled
#   gateway.istio.io/defaults-for-class: <class>
# and applies its contents as strategic merge patches to every Gateway it
# generates for that class. So we inject that ConfigMap here, and kapp owns it
# -- which means it survives addon reconciles by design rather than by luck.
#
# Container resources are deliberately NOT set here. They are set through the
# supported addon value istio.meshConfig.waypoint.resources in
# ../istio-ambient.yaml. Keeping one owner per setting avoids a precedence
# question between the two mechanisms.
#
# This file is a plain Kubernetes resource, not an overlay patch: ytt emits
# every non-annotated YAML document in its input set, so including it adds the
# object to the package output.
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-waypoint-defaults
  namespace: istio-system
  labels:
    gateway.istio.io/defaults-for-class: istio-waypoint
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 5
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  podDisruptionBudget: |
    spec:
      minAvailable: 1
