# cert-manager 1.20.2 on se-cluster-01.
#
# Installed so certificate material can be issued and rotated declaratively.
# The immediate use case is the Istio CA: istiod honours a plug-in CA from a
# secret named "cacerts" in istio-system (verified on this cluster), so
# cert-manager can own and rotate that intermediate rather than leaving istiod
# self-signed. The Istio addon exposes no CA options at all, so this is the
# route that does not require a ytt overlay.
#
# issuers[] bootstraps a self-signed ClusterIssuer. That is the root of the
# chain; a CA Certificate issued by it then produces the actual intermediate.
# Only self_signed issuers can be declared here -- CA, Vault or ACME issuers
# are applied as ordinary manifests on the workload cluster.
#
# Note: cert-manager issuing "cacerts" is NOT the same as cert-manager
# istio-csr. Here cert-manager owns the intermediate CA and istiod still issues
# workload certificates. istio-csr would have cert-manager issue every workload
# certificate, which needs istiod reconfigured and is not supported by the
# Istio addon.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: se-cluster-01-cert-manager
  namespace: se-namespace
spec:
  values:
    namespace: cert-manager
    issuers:
    - name: se-selfsigned
      self_signed:
        private_key:
          algorithm: RSA
          size: 4096
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: se-cluster-01-cert-manager
  namespace: se-namespace
spec:
  addonRef:
    name: cert-manager
  addonConfigNameTemplate: se-cluster-01-cert-manager
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: se-cluster-01
  crossNamespaceSelection: Blocked
  releaseFilter:
    ref:
      name: cert-manager.kubernetes.vmware.com.1.20.2-vmware.1-vks.1
  stopMatchingBehavior: Delete
