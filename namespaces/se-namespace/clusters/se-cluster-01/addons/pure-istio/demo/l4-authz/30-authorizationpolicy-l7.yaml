# The contrast: the same policy shape, but with an L7 condition.
#
# Apply this WITHOUT a waypoint and it does not work -- ztunnel cannot parse
# HTTP, so it cannot evaluate `methods`. Istio's behaviour here is to deny the
# whole connection at L4 rather than fail open, so the `allowed` caller starts
# failing too. That failure mode is the clearest demonstration of the boundary.
#
# To make it work, deploy the waypoint below and point the Service at it:
#
#   kubectl apply -f 30-authorizationpolicy-l7.yaml
#   kubectl -n l4demo label svc server istio.io/use-waypoint=waypoint
#
# IMPORTANT -- the L4 policy in 20-*.yaml does NOT stop applying once a waypoint
# exists. ztunnel still enforces it at the server pod, and the connection now
# arrives from the WAYPOINT's identity, not the client's. Measured in this lab
# with only sa/allowed in the principals list:
#
#   allowed GET -> 503   (waypoint admitted it, ztunnel then refused the waypoint)
#
# with the waypoint's own access log showing
#   UF,URX upstream_reset_before_response_started{connection_termination}
#
# So sa/waypoint must be added to 20-*.yaml's principals. After that:
#   allowed GET  -> 200
#   allowed POST -> 403   (HTTP status, from the waypoint's Envoy)
#   denied  GET  -> 403   (also the waypoint -- the L7 policy rejects it first)
#
# Note `denied` now gets 403 rather than the L4 reset: once the Service routes
# to a waypoint, the client's connection terminates at the waypoint, so that is
# where the client-facing decision is made.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: l4demo
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: server-methods
  namespace: l4demo
spec:
  targetRefs:
  - kind: Gateway
    group: gateway.networking.k8s.io
    name: waypoint
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/l4demo/sa/allowed"]
    to:
    - operation:
        # These three are L7-only. Nothing here is visible to ztunnel.
        methods: ["GET"]
        paths: ["/"]
