# Istio 1.28.2 in AMBIENT mode on se-cluster-01.
#
# 1.28.2 is pinned deliberately: it is the version the evidence brief
# (purecs/istio-ambient-vks-evidence-brief_2.md) was written against. The
# Supervisor also offers 1.27.1, 1.27.4, 1.27.5, 1.28.7 and 1.30.0.
#
# What each flag does:
#   ambientMode.enabled   ztunnel DaemonSet on every node -- L4 mTLS data plane,
#                         no sidecars injected.
#   istioCNI.enabled      required when ambient is on; redirects pod traffic
#                         into ztunnel. Exposes only enabled and resources --
#                         there is no excludeNamespaces setting.
#   enableStrictMTLS      FALSE here. The brief's estate needs PERMISSIVE at the
#                         start so the unenrolled "legacy" namespace can still
#                         reach the mesh; Phase 4 applies STRICT per namespace.
#                         Setting this true would create a mesh-wide STRICT
#                         PeerAuthentication and invalidate Phases 2 and 3.
#   gateways.ingress      FALSE here. The brief's Phase 10 uses a Gateway API
#                         Gateway with gatewayClassName istio, which
#                         participates in ambient. The classic ingress gateway
#                         is sidecar-mode and bypasses the waypoint.
#
# Waypoint sizing is set here; HPA and PDB have no addon values and come from
# overlays/waypoint-defaults.yml.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: se-cluster-01-istio
  namespace: se-namespace
spec:
  values:
    istio:
      ambientMode:
        enabled: true
      istioCNI:
        enabled: true
      enableStrictMTLS: false
      gateways:
        ingress:
          enabled: false
      pilot:
        replicas: 2
      meshConfig:
        accessLogFile: /dev/stdout
        waypoint:
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 2Gi
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: se-cluster-01-istio
  namespace: se-namespace
spec:
  addonRef:
    name: istio
  addonConfigNameTemplate: se-cluster-01-istio
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: se-cluster-01
  crossNamespaceSelection: Blocked
  releaseFilter:
    ref:
      name: istio.kubernetes.vmware.com.1.28.2-vmware.1-vks.1
  stopMatchingBehavior: Delete
