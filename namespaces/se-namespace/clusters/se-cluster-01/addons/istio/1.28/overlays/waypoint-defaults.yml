# Extra manifest injected into the Istio package's rendered output.
#
# NOT a ytt overlay patch -- no #@ syntax. kapp-controller's
# ytt-paths-from-secret-name annotation adds this file to ytt's input set, and
# ytt emits every non-annotated YAML document it is given, so the object joins
# the package's managed set and kapp owns it.
#
# Istio reads a ConfigMap in the root namespace labelled
# gateway.istio.io/defaults-for-class and applies its contents as strategic
# merge patches to every Gateway it generates for that class. HPA and PDB have
# no addon values, and a ytt overlay cannot patch the waypoint Deployment
# directly because istiod generates it at runtime -- it is never in the package
# for a matcher to select. Adding a ConfigMap for istiod to read is the route
# that works.
#
# Container resources are deliberately NOT set here; they come from
# istio.meshConfig.waypoint.resources in ../addon.yaml, so each setting has one
# owner. Verified on 1.30.0: precedence between the two is untested.
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-waypoint-defaults
  namespace: istio-system
  labels:
    gateway.istio.io/defaults-for-class: istio-waypoint
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 5
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  podDisruptionBudget: |
    spec:
      minAvailable: 1
