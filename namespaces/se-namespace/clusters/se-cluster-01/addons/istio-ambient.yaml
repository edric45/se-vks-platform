# Istio 1.30.0 in AMBIENT mode on se-cluster-01.
#
# What each flag gives us:
#   ambientMode.enabled   ztunnel DaemonSet on every node -- the L4 mTLS data
#                         plane. No sidecars are injected in ambient mode.
#   istioCNI.enabled      required whenever ambient is on; it redirects pod
#                         traffic into ztunnel.
#   enableStrictMTLS      creates a mesh-wide PeerAuthentication with mode
#                         STRICT, so plaintext between workloads is refused.
#   gateways.ingress      istio-ingressgateway (Envoy) in the istio-ingress
#                         namespace. Its Service is type LoadBalancer, so the
#                         VIP comes from NSX ALB. This is the north-south L7.
#
# Waypoints are NOT configured here. A waypoint is a per-namespace Envoy created
# with the Gateway API on the workload cluster -- see ../workloads/.
#
# 1.30.0 is the newest release this Supervisor offers and the best match for
# Kubernetes 1.35.6.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: se-cluster-01-istio
  namespace: se-namespace
spec:
  values:
    istio:
      ambientMode:
        enabled: true
      istioCNI:
        enabled: true
      enableStrictMTLS: true
      pilot:
        # Explicit rather than relying on the default, which is also 2. istiod
        # is in the path for cert issuance, so 2 replicas matter. Note this
        # needs node headroom: at best-effort-medium (2 vCPU) a rolling istiod
        # restart deadlocked with "Insufficient cpu", which is why the cluster
        # runs best-effort-large.
        replicas: 2
      meshConfig:
        waypoint:
          # Sizing for the waypoint Envoy. A waypoint proxies L7 for an entire
          # namespace, so the package defaults (100m/128Mi -> 2/1Gi) are thin.
          #
          # This is the ONLY waypoint property the addon can set. HPA and PDB
          # have no addon knob, and a ytt overlay cannot supply them either:
          # istiod generates the waypoint Deployment at runtime, so it is not
          # in the package for an overlay to match. They require the
          # gateway.istio.io/defaults-for-class ConfigMap in istio-system.
          #
          # Verified: this propagates without an istiod restart -- the mesh
          # controller updates the generated Deployment in place.
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 2Gi
      gateways:
        ingress:
          enabled: true
          namespace: istio-ingress
          replicas: 1
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: se-cluster-01-istio
  namespace: se-namespace
spec:
  addonRef:
    name: istio
  addonConfigNameTemplate: se-cluster-01-istio
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: se-cluster-01
  crossNamespaceSelection: Blocked
  releaseFilter:
    ref:
      name: istio.kubernetes.vmware.com.1.30.0-vmware.1-vks.1
  stopMatchingBehavior: Delete
