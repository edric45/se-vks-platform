# vSphere Namespace: se-namespace
#
# !! THIS MANIFEST WILL BE REJECTED ON MOST SUPERVISORS !!
#
# Applying it to wld-sup as Administrator@wkld01.vks.lab returns:
#
#   admission webhook "default.validating.namespace.supervisor.vmware.com"
#   denied the request: User is not authorized to create selfservice namespaces
#
# A vSphere Namespace is a vCenter construct. Creating one from a manifest only
# works when Namespace Self-Service is enabled on the Supervisor AND the user is
# granted it. Neither is the case here -- there are no namespace template CRDs
# on this Supervisor at all.
#
# Note that `kubectl auth can-i create namespaces` returns "yes" and a server
# dry-run SUCCEEDS. Both are misleading: RBAC permits it, and the vCenter-side
# admission webhook then refuses on the real request. Do not trust either as
# proof that this will work.
#
# CREATE THE NAMESPACE IN VCENTER INSTEAD:
#   Workload Management > Namespaces > Create Namespace
#     name    : se-namespace
#     storage : add vsan-default-storage-policy
#     VM class: add best-effort-medium
#     perms   : grant your SSO user/group edit access
#
# This file is kept as a record of the intended namespace and its name. Apply it
# only if Namespace Self-Service is enabled in your environment.
apiVersion: v1
kind: Namespace
metadata:
  name: se-namespace
