# vSphere Namespace.
#
# This creates the namespace object, but a namespace is only usable for
# clusters once vCenter has attached a storage policy and at least one VM
# class to it. Those bindings are vCenter-side and are NOT represented here --
# see README.md in this directory. Creating this file alone gives you an empty
# namespace that a Cluster cannot be scheduled into.
#
# The labels and annotations you see on a live namespace
# (vSphereClusterID, nsx.vmware.com/vpc_network_config,
# aviinfrasetting.ako.vmware.com/name) are generated by vCenter. Do not
# author them here; they will be populated for you.
apiVersion: v1
kind: Namespace
metadata:
  name: CHANGEME
