# vSphere Namespace.
#
# !! A vSphere Namespace is normally created in VCENTER, not from a manifest.
# On Supervisors without Namespace Self-Service enabled, applying this is
# rejected: "User is not authorized to create selfservice namespaces".
#
# Misleading: `kubectl auth can-i create namespaces` says yes and a server
# dry-run succeeds. Neither reflects a real apply.
#
# Create in: Workload Management > Namespaces > Create Namespace, then attach a
# storage policy, a VM class, and permissions -- none of which have a manifest
# form. See README.md in this directory.
apiVersion: v1
kind: Namespace
metadata:
  name: CHANGEME
